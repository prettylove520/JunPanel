name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Linux tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Tests with race detection
        run: go test -race -cover ./...
      - name: Go static checks
        run: go vet ./...
      - name: Browser and installer syntax
        run: |
          node --check web/app.js
          for script in install.sh quick-install.sh public-access.sh build.sh uninstall.sh; do
            bash -n "$script"
          done
          bash tests/ip-detection.sh
          bash tests/tls-defaults.sh
      - name: Linux amd64 and arm64 builds
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -buildvcs=false -trimpath -ldflags='-s -w -buildid=' -o "/tmp/junpanel-linux-$arch" .
          done
